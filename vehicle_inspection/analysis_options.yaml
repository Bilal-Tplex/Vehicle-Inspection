include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # Treat implicit downcasts and unresolved types as errors rather than
    # letting them fail at runtime on a device in the field.
    strict-casts: true
    strict-raw-types: true
  errors:
    # Missing awaits are almost always bugs in code that touches SQLite.
    unawaited_futures: error
    # Keep the tree free of dead imports.
    unused_import: error
    unused_local_variable: error
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # --- Off ------------------------------------------------------------------
    # False positive for our constructor style. We take public named parameters
    # and assign them to private fields (`AuthApi api` -> `_api`), which keeps
    # the field private without leaking the underscore into the call site.
    # The lint suggests `this._api`, but Dart forbids private named parameters,
    # so its advice does not compile.
    prefer_initializing_formals: false

    # --- On -------------------------------------------------------------------
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    directives_ordering: true
    prefer_final_in_for_each: true
    prefer_final_locals: true
    prefer_single_quotes: true
    require_trailing_commas: true
    sort_child_properties_last: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_parenthesis: true
    use_string_buffers: true
